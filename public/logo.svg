<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <!-- Define the gradients used for the 'G' and Arrow elements -->
    <linearGradient id="ggGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008FBF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00BFA5" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="ggGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2962FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#0091EA" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="ggGradientArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="1" />
      <stop offset="100%" stop-color="#2196F3" stop-opacity="1" />
    </linearGradient>
    
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&amp;display=swap');
      .company-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 28px; fill: #FFFFFF; }
      .tagline { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 14px; fill: #FFFFFF; opacity: 0.85; }
    </style>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(100, 45) scale(0.65)">
    <!-- Base 'G' and Teal/Aqua plumes -->
    <path d="M125,250 C70,250 20,200 20,135 C20,70 70,20 125,20 C110,60 100,100 110,140 C110,160 120,170 135,170 C160,170 180,160 190,140 L190,170 L240,170 C240,210 200,250 125,250 Z" fill="url(#ggGradient1)" />
    
    <!-- Royal Blue and Cyan plumes -->
    <path d="M100,160 C110,100 130,60 150,40 C130,80 120,120 140,150 L140,120 L180,120 C180,140 160,160 140,170 C120,170 100,160 100,160 Z" fill="url(#ggGradient2)" transform="translate(-10, 0)" />
    
    <!-- Bright Green/Teal plume and Arrow head -->
    <path d="M130,80 C140,40 160,20 180,10 C160,40 150,80 170,110 C150,110 130,100 130,80 Z" fill="url(#ggGradientArrow)" transform="translate(-10, 0)" />
    <path d="M190,40 L230,0 L220,50 L205,40 Z" fill="url(#ggGradientArrow)" transform="translate(-10, 0)" />
  </g>

  <!-- Text Group (Company Name and Tagline) -->
  <g transform="translate(200, 255)" text-anchor="middle">
    <text class="company-name" x="0" y="0">GRAVITECH GLOBAL</text>
    <text class="tagline" x="0" y="32">EMPOWERING GROWTH, ENABLING INNOVATION</text>
  </g>
</svg>
